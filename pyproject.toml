[project]
name = "velvetdub"
version = "0.1.0"
description = "Personal tool: filter, subtitle and (later) dub films and shows."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.12",
    "assemblyai>=1.6.1",
    "anthropic>=1.13.0",
    "google-genai>=2.29.0",
    "openai>=3.26.0",
    "httpx>=0.28.1",
]

[project.scripts]
vd = "velvetdub.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]
dubbing = [
    "coqui-tts>=0.27.5",
    "demucs>=4.1.0",
    "kokoro>=0.9.4",
    "piper-tts>=1.8.0",
    "soundfile>=0.14.0",
    "torchaudio==2.2.2",
    "transformers<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/velvetdub"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# The dubbing libraries are an optional install and are not type-checked here.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "demucs", "demucs.*", "soundfile", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
